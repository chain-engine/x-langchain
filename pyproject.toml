[project]
name = "x-langchain"
version = "0.2.0"
description = "LangChain Learning and Practice Project"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [
    { name = "John Young", email = "john.young@foxmail.com" },
]
dependencies = [
    # Core LangChain
    "langchain>=1.3.0",
    "langchain-core>=1.5.0",
    "langchain-openai>=1.4.0",
    "langchain-anthropic>=1.5.0",
    # Note: langchain-community is sunset (0.4.2), consider migrating
    "langchain-community>=0.4.2",
    # MCP Protocol
    "langchain-mcp-adapters>=0.3.0",
    # Configuration
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    # LLM Providers
    "dashscope>=1.25.11",
    # Tools
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.11.1",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "aiomysql>=0.2.0",
    # Utilities
    "loguru>=0.7.3",
    "requests>=2.31.0",
]

[project.optional-dependencies]
ui = [
    "gradio>=5.0.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
x-langchain = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.6.0",
    "pyright>=1.1.0",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]
