# =============================================================================
# Agent 配置
# =============================================================================
agent:
  model_provider: deepseek
  model_name: null  # 若 provider 为 deepseek，此处指定模型名
  temperature: 0.0
  max_tokens: 4096
  max_iterations: 10
  timeout: 60
  enable_memory: true
  enable_planning: false
  enable_tools: true
  mode: react
  debug: false

# =============================================================================
# 数据库配置
# =============================================================================
database:
  db_url: ""
  db_host: localhost
  db_port: 3306
  db_user: root
  db_password: ""
  db_name: ""
  text_to_sql_max_rows: 100
  text_to_sql_timeout: 30
  text_to_sql_model_name: null

# =============================================================================
# 工具配置
# =============================================================================
tools:
  amap_api_key: ""
  mcp_enabled: false

# =============================================================================
# 日志配置
# =============================================================================
logging:
  level: INFO
  log_dir: ./logs
  rotation: "1 day"
  retention: "7 days"
  console_level: DEBUG

# =============================================================================
# 中间件配置
# =============================================================================
middleware:
  max_iterations: 20
  warn_threshold: 0.8

# =============================================================================
# Prompts 提示词配置
# =============================================================================
prompts:
  templates_dir: ""  # 留空使用默认路径 src/prompts/templates
  enable_cache: true  # 是否启用模板缓存

# =============================================================================
# LLM Provider 配置
# =============================================================================
llm_providers:
  model_name: deepseek
  deepseek_api_key: ""
  deepseek_api_base: https://api.deepseek.com/v1
  deepseek_model_name: deepseek-v4-pro  # 支持: deepseek-v4-pro, deepseek-v4-flash
  doubao_api_key: ""
  doubao_api_base: https://ark.cn-beijing.volces.com/api/v3
  doubao_model_name: ""
  aliyun_api_key: ""
  aliyun_api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
  aliyun_model_name: qwen-plus
